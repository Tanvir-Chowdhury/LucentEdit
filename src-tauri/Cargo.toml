[package]
name = "lucentedit"
version = "0.10.0"
description = "LucentEdit: lightweight open-source image and vector editor"
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "lucentedit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
fontdb = "0.24"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
